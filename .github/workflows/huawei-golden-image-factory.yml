name: Huawei Cloud Golden Image Pipeline

on:
  workflow_dispatch:
    inputs:
      os_choice:
        description: 'Target Operating System'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - Rocky 9
          - Ubuntu 24.04
          - Windows Server 2022
      scan_only:
        description: 'Skip Packer Build (Run Compliance Scan Only)'
        required: true
        default: false
        type: boolean
      hw_region:
        description: 'Huawei Cloud Region (Leave blank to use default, my-kualalumpur-1)'
        required: false
        type: string
      rocky_image_name_override:
        description: 'Custom Rocky Image Name Override (Optional)'
        required: false
        type: string
      ubuntu_image_name_override:
        description: 'Custom Ubuntu Image Name Override (Optional)'
        required: false
        type: string
      windows_image_name_override:
        description: 'Custom Windows Image Name Override (Optional)'
        required: false
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  # ============================================================
  # STAGE 1: PREPARE (Calculate SemVer & Build Matrix)
  # ============================================================
  prepare:
    name: Prepare Pipeline & SemVer
    runs-on: ubuntu-latest
    outputs:
      new_version:   ${{ steps.version.outputs.clean_version || '1.0.0' }}
      matrix_config: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Calculate Next SemVer
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: hw-v
          dry_run: true
          default_bump: patch

      - name: Normalize Version String
        id: version
        run: |
          RAW="${{ steps.semver.outputs.new_version }}"
          CLEAN="${RAW#v}"
          CLEAN="${CLEAN%%-*}"
          echo "clean_version=$CLEAN" >> $GITHUB_OUTPUT

      - name: Set Dynamic Matrix
        id: set-matrix
        run: |
          CHOICE="${{ inputs.os_choice }}"
          if [[ -z "$CHOICE" || "$CHOICE" == "all" ]]; then
            echo 'matrix=[{"os":"Huawei Rocky 9","runner":"self-hosted"},{"os":"Huawei Ubuntu 24.04","runner":"self-hosted"},{"os":"Huawei Windows Server 2022","runner":"self-hosted"}]' >> $GITHUB_OUTPUT
          elif [[ "$CHOICE" == "Rocky 9" ]]; then
            echo 'matrix=[{"os":"Huawei Rocky 9","runner":"self-hosted"}]' >> $GITHUB_OUTPUT
          elif [[ "$CHOICE" == "Ubuntu 24.04" ]]; then
            echo 'matrix=[{"os":"Huawei Ubuntu 24.04","runner":"self-hosted"}]' >> $GITHUB_OUTPUT
          elif [[ "$CHOICE" == "Windows Server 2022" ]]; then
            echo 'matrix=[{"os":"Huawei Windows Server 2022","runner":"self-hosted"}]' >> $GITHUB_OUTPUT
          fi

  # ============================================================
  # STAGE 2: BUILD & SCAN (Parallel Matrix)
  # ============================================================
  matrix-factory:
    name: Build & Scan (${{ matrix.os_config.os }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os_config: ${{ fromJson(needs.prepare.outputs.matrix_config) }}

    env:
      # ── Huawei Cloud SDK variables (Required for pre-flight auth) ───────
      HW_ACCESS_KEY:                ${{ secrets.HW_ACCESS_KEY }}
      HW_SECRET_KEY:                ${{ secrets.HW_SECRET_KEY }}
      HW_PROJECT_ID:                ${{ secrets.HW_PROJECT_ID }}
      HW_LOCATION:                  ${{ inputs.hw_region || vars.HW_LOCATION }}

      # ── Huawei Cloud Packer variables (Required for .pkr.hcl) ───────────
      PKR_VAR_hw_access_key:        ${{ secrets.HW_ACCESS_KEY }}
      PKR_VAR_hw_secret_key:        ${{ secrets.HW_SECRET_KEY }}
      PKR_VAR_hw_project_id:        ${{ secrets.HW_PROJECT_ID }}
      PKR_VAR_hw_region:            ${{ inputs.hw_region || vars.HW_LOCATION }}
      PKR_VAR_hw_vpc_id:            ${{ secrets.HW_VPC_ID }}
      PKR_VAR_hw_subnet_id:         ${{ secrets.HW_SUBNET_ID }}
      PKR_VAR_hw_security_group_id: ${{ secrets.HW_SECURITY_GROUP_ID }}
      PKR_VAR_windows_admin_pass:   ${{ secrets.WINDOWS_LOCAL_ADMIN_PASSWORD }}
      PKR_VAR_hw_eip_id:            ${{ secrets.HW_EXISTING_EIP_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Resolve VM Slug
        run: |
          case "${{ matrix.os_config.os }}" in
            "Huawei Rocky 9")             echo "VM_SLUG=hw-rocky"   >> $GITHUB_ENV ;;
            "Huawei Ubuntu 24.04")        echo "VM_SLUG=hw-ubuntu"  >> $GITHUB_ENV ;;
            "Huawei Windows Server 2022") echo "VM_SLUG=hw-windows" >> $GITHUB_ENV ;;
            *)
              echo "ERROR: Unrecognised OS '${{ matrix.os_config.os }}'"
              exit 1
              ;;
          esac

      - name: 'Install CAE CLI, Ansible & Set Configuration'
        run: |
          sudo apt-get update -qq
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user 'ansible>=10.0.0,<11.0.0'
          pip install "pywinrm>=0.3.0"
          curl -LO "https://tm-cli.obs.my-kualalumpur-1.alphaedge.tmone.com.my/cli/latest/caecloud-cli-linux-amd64.tar.gz"
          tar -zxvf caecloud-cli-linux-amd64.tar.gz
          sudo mv $(pwd)/cae /usr/local/bin/
          echo "y" | cae version
          echo "y" | cae configure set \
            --cli-access-key="${{ secrets.HW_ACCESS_KEY }}" \
            --cli-secret-key="${{ secrets.HW_SECRET_KEY }}" \
            --cli-project-id="${{ secrets.HW_PROJECT_ID }}" \
            --cli-region="${{ env.HW_LOCATION }}" \
            --cli-skip-secure-verify=true

      # ──────────────────────────────────────────────────────────────────────
      # PACKER BUILD PHASE
      # ──────────────────────────────────────────────────────────────────────

      - name: Setup HashiCorp Packer
        if: ${{ inputs.scan_only != true }}
        uses: hashicorp/setup-packer@v3.2.0
        with:
          version: 'latest'

      - name: Install Ansible Galaxy roles
        if: ${{ inputs.scan_only != true }}
        working-directory: ./ansible
        run: |
          echo "Roles missing. Installing from requirements.yml..."
          ansible-galaxy install -r requirements.yml --roles-path roles/

      - name: Packer Init
        if: ${{ inputs.scan_only != true }}
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packer init .
        working-directory: >-
          ${{ matrix.os_config.os == 'Huawei Rocky 9' && './packer-huawei-rocky'
           || matrix.os_config.os == 'Huawei Ubuntu 24.04' && './packer-huawei-ubuntu'
           || './packer-huawei-windows' }}
        
      - name: Prepare user_data with WinRM and PermitRootLogin fix
        if: ${{ inputs.scan_only != true }}
        run: |
          if [[ "${{ matrix.os_config.os }}" == "Huawei Windows Server 2022" ]]; then
            # We pipe through sed to strip leading YAML spaces. 
            # #ps1_sysnative MUST be at the exact beginning of the file!
            cat << 'EOF' | sed 's/^[ \t]*//' > /tmp/hw_userdata.ps1
            #ps1_sysnative
            $ErrorActionPreference = "Stop"

            # ==========================================
            # 1. WINRM BOOTSTRAP (Required for Packer)
            # ==========================================
            Get-ChildItem WSMan:\Localhost\Listener |
                Where-Object { $_.Keys -contains "Transport=HTTP" } |
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

            $Cert = New-SelfSignedCertificate -CertstoreLocation Cert:\LocalMachine\My -DnsName "packer-build"

            New-Item -Path WSMan:\LocalHost\Listener -Transport HTTPS -Address * `
                -CertificateThumbPrint $Cert.Thumbprint -Force

            winrm set winrm/config/service '@{AllowUnencrypted="false"}'
            winrm set winrm/config/service/auth '@{Basic="false"}'
            winrm set winrm/config/service/auth '@{Negotiate="true"}'
            winrm set winrm/config/winrs '@{MaxMemoryPerShellMB="1024"}'

            New-NetFirewallRule -DisplayName "WinRM-HTTPS" -Direction Inbound -LocalPort 5986 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue
            
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' `
                -Name 'LmCompatibilityLevel' -Value 2 -Type DWord -Force

            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0' `
                -Name 'NTLMMinServerSec' -Value 536870912 -Type DWord -Force

            Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\.NetFramework\v4.0.30319' `
                -Name 'SchUseStrongCrypto' -Value 1 -Type DWord -Force

            Set-ItemProperty -Path 'HKLM:\SOFTWARE\Wow6432Node\Microsoft\.NetFramework\v4.0.30319' `
                -Name 'SchUseStrongCrypto' -Value 1 -Type DWord -Force

            Set-Service -Name WinRM -StartupType Automatic
            Start-Service WinRM

            # ==========================================
            # 2. OPENSSH BOOTSTRAP (Required for Scanner)
            # ==========================================
            $sshDir = "$env:ProgramData\ssh"
            if (!(Test-Path $sshDir)) {
                New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
            }

            $adminKeysPath = "$sshDir\administrators_authorized_keys"
            Set-Content -Path $adminKeysPath -Value "SCANNER_PUB_KEY_PLACEHOLDER" -Encoding Ascii -Force
            
            icacls.exe $adminKeysPath /inheritance:r /grant "NT AUTHORITY\SYSTEM:(F)" /grant "BUILTIN\Administrators:(F)" | Out-Null

            $sshdConfig = "$sshDir\sshd_config"
            if (Test-Path $sshdConfig) {
                (Get-Content $sshdConfig) -replace "(?m)^#?StrictModes yes", "StrictModes no" | Set-Content $sshdConfig -Encoding Ascii
            }

            if (!(Get-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -ErrorAction SilentlyContinue)) {
                New-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -DisplayName "OpenSSH Server (sshd)" -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 | Out-Null
            }

            Set-Service -Name sshd -StartupType Automatic
            Restart-Service sshd -Force
            EOF
            
            sed -i "s|SCANNER_PUB_KEY_PLACEHOLDER|${SCANNER_PUB_KEY}|g" /tmp/hw_userdata.ps1
            echo "USERDATA_FILE=/tmp/hw_userdata.ps1" >> $GITHUB_ENV
          else
            # Linux scanner userdata block...
            printf '#!/bin/bash\nsed -i "s/^#\\?PermitRootLogin.*/PermitRootLogin yes/" /etc/ssh/sshd_config\nsystemctl restart sshd\n' > /tmp/hw_userdata.sh
            chmod +x /tmp/hw_userdata.sh
            echo "Verifying user_data contents:"
            cat /tmp/hw_userdata.sh
            echo "USERDATA_FILE=/tmp/hw_userdata.sh" >> $GITHUB_ENV
          fi

      - name: Build Golden Image
        if: ${{ inputs.scan_only != true }}
        env:
          PACKER_LOG: "1"
        run: |
          packer build \
            -force \
            -var "image_version=${{ needs.prepare.outputs.new_version }}" \
            -var "user_data_file=${{ env.USERDATA_FILE }}" \
            .
        working-directory: >-
          ${{ matrix.os_config.os == 'Huawei Rocky 9' && './packer-huawei-rocky'
           || matrix.os_config.os == 'Huawei Ubuntu 24.04' && './packer-huawei-ubuntu'
           || './packer-huawei-windows' }}

      # ──────────────────────────────────────────────────────────────────────
      # DEPLOY EPHEMERAL VM FOR SCANNING
      # ──────────────────────────────────────────────────────────────────────

      - name: Generate Ephemeral SSH Key
        run: ssh-keygen -t ed25519 -f ~/.ssh/scanner_key -N ""

      - name: Resolve Target Image Name
        id: image
        run: |
          case "${{ matrix.os_config.os }}" in
            "Huawei Rocky 9")       echo "name=${{ inputs.rocky_image_name_override   || format('rocky9-cis-v{0}', needs.prepare.outputs.new_version) }}" >> $GITHUB_OUTPUT ;;
            "Huawei Ubuntu 24.04")  echo "name=${{ inputs.ubuntu_image_name_override  || format('ubuntu24.04-cis-v{0}', needs.prepare.outputs.new_version) }}" >> $GITHUB_OUTPUT ;;
            "Huawei Windows Server 2022") echo "name=${{ inputs.windows_image_name_override || format('win2022-cis-v{0}', needs.prepare.outputs.new_version) }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Prepare user_data for Pipeline Scanner
        run: |
          echo "--- Generating Cloud-Init for Ephemeral Scanner ---"
          SCANNER_PUB_KEY=$(cat ~/.ssh/scanner_key.pub)

          if [[ "${{ matrix.os_config.os }}" == "Huawei Windows Server 2022" ]]; then
            # We use 'EOF' without indentation to ensure GitHub Actions YAML doesn't break
            cat << 'EOF' > /tmp/hw_scan_userdata.ps1
          #ps1_sysnative
          $ErrorActionPreference = "Continue"

          Write-Output "--- Starting Ephemeral Scanner Initialization ---"

          # 1. WAIT FOR CIS HARDENING TO FINISH
          # Prevent Cloudbase-Init from injecting SSH keys before the CIS task resets them
          $logPath = "C:\Windows\Setup\Scripts\RestoreCIS.log"
          $waited = 0
          while ($waited -lt 600) {
              if (Test-Path $logPath) {
                  $logContent = Get-Content $logPath -Raw -ErrorAction SilentlyContinue
                  if ($logContent -match "sshd restarted") {
                      Write-Output "CIS Hardening completed."
                      break
                  }
              }
              Write-Output "Waiting for CIS hardening... ($waited s)"
              Start-Sleep -Seconds 10
              $waited += 10
          }

          # 2. FIX UAC REMOTE RESTRICTIONS
          # Required for users in the Administrators group to authenticate over network/SSH
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "LocalAccountTokenFilterPolicy" -Value 1 -Force

          # 3. INJECT SSH KEY FOR 'sysadmin' USER (Bulletproof method)
          $sysadminSid = (Get-LocalUser -Name 'sysadmin').SID.Value
          $userSsh = "C:\Users\sysadmin\.ssh"
          if (-not (Test-Path $userSsh)) { New-Item -ItemType Directory -Force -Path $userSsh | Out-Null }
          Set-Content -Path "$userSsh\authorized_keys" -Value "SCANNER_PUB_KEY_PLACEHOLDER" -Encoding Ascii -Force
          icacls.exe "$userSsh\authorized_keys" /inheritance:r /grant "*$($sysadminSid):(F)" /grant "NT AUTHORITY\SYSTEM:(F)" | Out-Null

          # 4. INJECT FALLBACK SSH KEY FOR ADMINISTRATORS GROUP
          $sshProgramData = "$env:ProgramData\ssh"
          if (-not (Test-Path $sshProgramData)) { New-Item -ItemType Directory -Force -Path $sshProgramData | Out-Null }
          $adminKeysPath = "$sshProgramData\administrators_authorized_keys"
          Set-Content -Path $adminKeysPath -Value "SCANNER_PUB_KEY_PLACEHOLDER" -Encoding Ascii -Force
          icacls.exe $adminKeysPath /inheritance:r /grant "NT AUTHORITY\SYSTEM:(F)" /grant "BUILTIN\Administrators:(F)" | Out-Null

          # 5. FIX STRICTMODES IN SSHD_CONFIG
          $sshdConfig = "$sshProgramData\sshd_config"
          if (Test-Path $sshdConfig) {
              (Get-Content $sshdConfig) -replace "(?m)^#?StrictModes yes", "StrictModes no" | Set-Content $sshdConfig -Encoding Ascii
          }

          # 6. ENSURE FIREWALL ALLOWS SSH
          if (!(Get-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -ErrorAction SilentlyContinue)) {
              New-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -DisplayName "OpenSSH Server (sshd)" -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 | Out-Null
          }

          # 7. RESTART SSHD
          Restart-Service sshd -Force
          Write-Output "--- SSH configuration finalized and service restarted ---"
          EOF

            # Inject the actual public key into the placeholder
            sed -i "s|SCANNER_PUB_KEY_PLACEHOLDER|${SCANNER_PUB_KEY}|g" /tmp/hw_scan_userdata.ps1
            echo "USERDATA_FILE=/tmp/hw_scan_userdata.ps1" >> $GITHUB_ENV

          else
            # Linux scanner userdata block
            cat << 'EOF' > /tmp/hw_scan_userdata.sh
          #!/bin/bash
          mkdir -p /home/sysadmin/.ssh
          echo 'SCANNER_PUB_KEY_PLACEHOLDER' >> /home/sysadmin/.ssh/authorized_keys
          chown -R sysadmin:sysadmin /home/sysadmin/.ssh
          chmod 700 /home/sysadmin/.ssh
          chmod 600 /home/sysadmin/.ssh/authorized_keys
          sed -i "s/^#\?PermitRootLogin.*/PermitRootLogin yes/" /etc/ssh/sshd_config
          systemctl restart sshd
          EOF
            
            sed -i "s|SCANNER_PUB_KEY_PLACEHOLDER|${SCANNER_PUB_KEY}|g" /tmp/hw_scan_userdata.sh
            chmod +x /tmp/hw_scan_userdata.sh
            echo "USERDATA_FILE=/tmp/hw_scan_userdata.sh" >> $GITHUB_ENV
          fi

      - name: Deploy Ephemeral VM
        run: |
          IMAGE_NAME="${{ steps.image.outputs.name }}"
          echo "Resolving IMS image ID for: $IMAGE_NAME"

          cae IMS ListImages \
            --cli-region="${{ env.HW_LOCATION }}" \
            --cli-warning=false \
            > /tmp/ims_list_output.json 2>/dev/null || true

          HW_IMAGE_ID=$(jq -r --arg name "$IMAGE_NAME" \
            '.images[] | select(.name == $name) | .id // empty' \
            /tmp/ims_list_output.json | head -1)

          if [[ -z "$HW_IMAGE_ID" ]]; then
            echo "ERROR: No image found with name '$IMAGE_NAME'"
            jq -r '.images[] | "\(.name) (\(.id))"' /tmp/ims_list_output.json || true
            exit 1
          fi

          echo "Resolved: $IMAGE_NAME → $HW_IMAGE_ID"
          echo "HW_IMAGE_ID=$HW_IMAGE_ID" >> $GITHUB_ENV

          EPHEMERAL_NAME="scan-ephemeral-${{ env.VM_SLUG }}"

          if [[ "${{ matrix.os_config.os }}" == "Huawei Windows Server 2022" ]]; then
            ENCODED_USER_DATA=$(base64 -w 0 /tmp/hw_userdata.ps1)
          else
            ENCODED_USER_DATA=$(base64 -w 0 /tmp/hw_userdata.sh)
          fi

          cae ECS CreateServers --help | grep -i public

          cae ECS CreateServers \
            --cli-region="${{ env.HW_LOCATION }}" \
            --cli-warning=false \
            --server.name="$EPHEMERAL_NAME" \
            --server.flavorRef="c6.large.2" \
            --server.imageRef="$HW_IMAGE_ID" \
            --server.vpcid="${{ secrets.HW_VPC_ID }}" \
            --server.nics.1.subnet_id="${{ secrets.HW_SUBNET_ID }}" \
            --server.security_groups.1.id="${{ secrets.HW_SECURITY_GROUP_ID }}" \
            --server.root_volume.volumetype="SAS" \
            --server.user_data="$ENCODED_USER_DATA" \
            --server.publicip.id="${{ secrets.HW_EXISTING_EIP_ID }}" \
            > create_server_output.json 2>&1

          echo "--- Raw CreateServers response ---"
          cat create_server_output.json

          if ! jq -e '.job_id' create_server_output.json > /dev/null 2>&1; then
            echo "ERROR: CreateServers API call failed."
            exit 1
          fi

          HW_SERVER_ID=$(jq -r '.serverIds[0] // empty' create_server_output.json)
          echo "HW_SERVER_ID=$HW_SERVER_ID" >> $GITHUB_ENV
          echo "EPHEMERAL_NAME=$EPHEMERAL_NAME" >> $GITHUB_ENV
          echo "Server ID saved for teardown: $HW_SERVER_ID"

          HW_JOB_ID=$(jq -r '.job_id' create_server_output.json)
          echo "Job submitted: $HW_JOB_ID. Waiting for completion..."

          for i in {1..30}; do
            JOB_OUTPUT=$(cae ECS ShowJob \
              --cli-region="${{ env.HW_LOCATION }}" \
              --cli-warning=false \
              --cli-output=json \
              --job_id="$HW_JOB_ID" \
              2>/dev/null)

            if [[ "$i" -eq 1 ]]; then
              echo "--- Raw ShowJob response (attempt 1) ---"
              echo "$JOB_OUTPUT"
            fi

            STATUS=$(echo "$JOB_OUTPUT" | jq -r '.status // empty' 2>/dev/null)
            echo "Job status: $STATUS (attempt $i/30)"

            if [[ "$STATUS" == "SUCCESS" ]]; then 
              echo "VM is ACTIVE. Waiting 30s for cloud-init and NIC propagation..."
              sleep 30
              break
            fi
            
            if [[ "$STATUS" == "FAIL" ]]; then
              echo "ERROR: ECS CreateServers job failed."
              echo "$JOB_OUTPUT"
              exit 1
            fi

            sleep 10
            if [[ "$i" -eq 30 ]]; then
              echo "ERROR: Timed out waiting for VM creation."
              exit 1
            fi
          done

          cae ECS ShowServer \
            --cli-region="${{ env.HW_LOCATION }}" \
            --cli-warning=false \
            --cli-output=json \
            --project_id="${{ secrets.HW_PROJECT_ID }}" \
            --server_id="$HW_SERVER_ID" \
            > /tmp/show_server_output.json 2>/dev/null

          jq -r '.server.addresses' /tmp/show_server_output.json

          echo "--- Raw ShowServer response ---"
          cat /tmp/show_server_output.json

          VM_IP=$(jq -r '.server.addresses[][] | select(.["OS-EXT-IPS:type"] == "floating") | .addr // empty' /tmp/show_server_output.json)

          if [[ -z "$VM_IP" ]]; then
            echo "ERROR: Failed to retrieve public IP address from server details."
            cat /tmp/show_server_output.json
            exit 1
          fi

          echo "VM_IP=$VM_IP" >> $GITHUB_ENV
          echo "Ephemeral VM Public IP: $VM_IP"

      # ──────────────────────────────────────────────────────────────────────
      # WAIT FOR SSH
      # ──────────────────────────────────────────────────────────────────────

      - name: Wait for SSH Connection
        run: |
          for i in {1..20}; do
            if ssh -o StrictHostKeyChecking=no \
                  -o ConnectTimeout=5 \
                  -i ~/.ssh/scanner_key \
                  sysadmin@"$VM_IP" exit 0 2>/dev/null; then
              echo "SSH is up after attempt $i."
              break
            fi
            echo "Attempt $i/20 — SSH not ready, retrying in 10s..."
            sleep 10
            if [ "$i" -eq 20 ]; then
              echo "ERROR: SSH never became available after 200s."
              exit 1
            fi
          done

      # ──────────────────────────────────────────────────────────────────────
      # SCAN PHASE
      # ──────────────────────────────────────────────────────────────────────

      - name: Run Cinc Auditor & Generate Multi-Format Reports (Windows)
        if: ${{ matrix.os_config.os == 'Huawei Windows Server 2022' }}
        run: |
          echo "Installing Cinc Auditor..."
          curl -sL https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-auditor
          
          echo "Executing Cinc Auditor against hardened Windows Image..."
          for i in {1..10}; do
            if cinc-auditor exec https://github.com/dev-sec/windows-baseline \
              -t ssh://sysadmin@${{ env.VM_IP }} \
              -i ~/.ssh/scanner_key \
              --input server_role=member_server \
              --input domain_joined=false \
              --backend-cache \
              --reporter html:./hw-windows-cis-report.html json:./hw-windows-cis-report.json cli; then
              
              echo "Cinc Auditor completed successfully."
              break
            else
              echo "Warning: Authentication dropped. Retrying in 15 seconds..."
              sleep 15
            fi
          done

      - name: Run Huawei Rocky OpenSCAP & Download Report
        if: ${{ matrix.os_config.os == 'Huawei Rocky 9' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/scanner_key \
              sysadmin@${{ env.VM_IP }} << 'EOF'
            sudo dnf install -y openscap-scanner scap-security-guide
            sudo oscap xccdf eval \
              --profile xccdf_org.ssgproject.content_profile_cis_server_l1 \
              --report /tmp/hw-rocky-cis-report.html \
              /usr/share/xml/scap/ssg/content/ssg-rl9-ds.xml || true
            sudo cp /tmp/hw-rocky-cis-report.html /home/sysadmin/
            sudo chown sysadmin:sysadmin /home/sysadmin/hw-rocky-cis-report.html
          EOF
          scp -o StrictHostKeyChecking=no -i ~/.ssh/scanner_key \
            sysadmin@${{ env.VM_IP }}:/home/sysadmin/hw-rocky-cis-report.html \
            ./hw-rocky-cis-report.html

      - name: Run Huawei Ubuntu 24.04 OpenSCAP & Download Report
        if: ${{ matrix.os_config.os == 'Huawei Ubuntu 24.04' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/scanner_key \
              sysadmin@${{ env.VM_IP }} << 'EOF'
            sudo apt-get update -qq
            sudo apt-get install -y openscap-scanner unzip wget
            wget -q https://github.com/ComplianceAsCode/content/releases/download/v0.1.81/scap-security-guide-0.1.81.zip
            unzip -q scap-security-guide-0.1.81.zip
            sudo oscap xccdf eval \
              --profile xccdf_org.ssgproject.content_profile_cis_level1_server \
              --report /tmp/hw-ubuntu-2404-cis-report.html \
              scap-security-guide-0.1.81/ssg-ubuntu2404-ds.xml || true
            sudo cp /tmp/hw-ubuntu-2404-cis-report.html /home/sysadmin/
            sudo chown sysadmin:sysadmin /home/sysadmin/hw-ubuntu-2404-cis-report.html
          EOF
          scp -o StrictHostKeyChecking=no -i ~/.ssh/scanner_key \
            sysadmin@${{ env.VM_IP }}:/home/sysadmin/hw-ubuntu-2404-cis-report.html \
            ./hw-ubuntu-2404-cis-report.html

      # ──────────────────────────────────────────────────────────────────────
      # TEARDOWN
      # ──────────────────────────────────────────────────────────────────────

      - name: Prune Empty Reports (Failsafe)
        if: always()
        run: |
          echo "Removing any 0-byte reports to prevent GitHub Release API errors..."
          find . -maxdepth 1 -name "*-cis-report.*" -type f -size 0 -print -delete

      - name: Destroy Ephemeral VM (Huawei)
        if: always() && env.HW_SERVER_ID != ''
        run: |
          cae ECS DeleteServers \
            --cli-region="${{ env.HW_LOCATION }}" \
            --cli-warning=false \
            --servers.1.id="$HW_SERVER_ID" \
            --delete_volume=true
          echo "Ephemeral VM $HW_SERVER_ID deletion requested."

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VM_SLUG }}-report
          path: ./*-cis-report.*

      # ──────────────────────────────────────────────────────────────────────
      # RUNNER CLEANUP
      # ──────────────────────────────────────────────────────────────────────

      - name: Clean up Self-Hosted Runner State
        if: always()
        run: |
          echo "Cleaning up temporary files to prevent state contamination..."
          rm -f ~/.ssh/scanner_key ~/.ssh/scanner_key.pub
          rm -f ./*-cis-report.*
          rm -f ./crash.log
          echo "Runner cleanup complete."

  # ============================================================
  # STAGE 3: PUBLISH (Tag & Release)
  # ============================================================
  release:
    name: Publish Huawei DevSecOps Release
    needs: [prepare, matrix-factory]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() }}
    steps:
      - name: Download All Reports
        uses: actions/download-artifact@v4
        with:
          path: ./reports
          merge-multiple: true

      - name: Push Official Git Tag
        if: ${{ inputs.scan_only != true }}
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: hw-v
          custom_tag: ${{ needs.prepare.outputs.new_version }}

      - name: Publish Golden Image Release
        if: ${{ inputs.scan_only != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hw-v${{ needs.prepare.outputs.new_version }}
          name: "Huawei Golden Image Release v${{ needs.prepare.outputs.new_version }}"
          body: |
            ## Huawei Cloud Golden Image Factory — v${{ needs.prepare.outputs.new_version }}

            Automated CIS Level 1 Compliance Reports for all built Huawei Cloud images.

            | Image | Benchmark | Profile |
            |-------|-----------|---------|
            | Huawei Rocky Linux 9 | CIS AlmaLinux/Rocky Linux 9 | Level 1 Server |
            | Huawei Ubuntu 24.04 | CIS Ubuntu Linux 24.04 LTS | Level 1 Server |

            **IMS image version:** `${{ needs.prepare.outputs.new_version }}`
            **Region:** `${{ inputs.hw_region || vars.HW_LOCATION }}`
          fail_on_unmatched_files: false
          files: ./reports/*-cis-report.*

      - name: Publish Ad-Hoc Scan Report
        if: ${{ inputs.scan_only == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hw-scan-report-${{ github.run_number }}
          name: "Huawei Ad-Hoc Compliance Scan #${{ github.run_number }}"
          body: |
            Manual CIS Level 1 compliance evaluation against existing Huawei IMS images.
            *(No new image versions were built during this run.)*
          fail_on_unmatched_files: false
          files: |
            ./reports/*-cis-report.html
            ./reports/*-cis-report.json