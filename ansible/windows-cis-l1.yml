- name: "CIS Hardening - Attempt 1"
  hosts: all
  gather_facts: true
  vars:
    win_2022_cis_level_1: true
    win_2022_cis_level_2: false
  tasks:
    - block:
        - name: Run CIS hardening role
          ansible.builtin.include_role:
            name: windows_2022_cis
        - name: Mark CIS role as completed
          ansible.builtin.set_fact:
            cis_role_completed: true
            cacheable: true
      rescue:
        - name: Mark attempt as failed (will retry next play)
          ansible.builtin.set_fact:
            cis_role_completed: false
            cacheable: true

- name: "CIS Hardening - Attempt 2 (retry after disconnect)"
  hosts: all
  gather_facts: false
  vars:
    win_2022_cis_level_1: true
    win_2022_cis_level_2: false
  tasks:
    - name: Reset unreachable/failed state from previous play so this play can reconnect
      ansible.builtin.meta: clear_host_errors

    - name: Pause to let WinRM/service recover before reconnecting
      ansible.builtin.pause:
        seconds: 20
      delegate_to: localhost
      when: not (cis_role_completed | default(false))

    - block:
        - name: Retry CIS hardening role
          ansible.builtin.include_role:
            name: windows_2022_cis
          when: not (cis_role_completed | default(false))
        - name: Mark CIS role as completed
          ansible.builtin.set_fact:
            cis_role_completed: true
            cacheable: true
          when: not (cis_role_completed | default(false))
      rescue:
        - ansible.builtin.set_fact:
            cis_role_completed: false
            cacheable: true

- name: "CIS Hardening - Attempt 3 (final retry)"
  hosts: all
  gather_facts: false
  vars:
    win_2022_cis_level_1: true
    win_2022_cis_level_2: false
  tasks:
    - name: Reset unreachable/failed state from previous play so this play can reconnect
      ansible.builtin.meta: clear_host_errors

    - name: Pause before final retry
      ansible.builtin.pause:
        seconds: 20
      delegate_to: localhost
      when: not (cis_role_completed | default(false))

    - name: Final retry of CIS hardening role
      ansible.builtin.include_role:
        name: windows_2022_cis
      when: not (cis_role_completed | default(false))

    - name: Fail the build if still not completed after 3 attempts
      ansible.builtin.fail:
        msg: "CIS hardening failed to complete after 3 attempts — likely a persistent WinRM issue, not transient."
      when: not (cis_role_completed | default(false))

# =============================================================================
# CRITICAL CI FIX: Prop the door open for Packer!
# These tasks run immediately after the CIS role finishes to ensure
# Packer doesn't get locked out during the windows-restart and sysprep steps.
# =============================================================================
- name: "Post-hardening: WinRM re-enablement for Packer"
  hosts: all
  gather_facts: false
  tasks:
    - name: Reset unreachable/failed state before final post-hardening pass
      ansible.builtin.meta: clear_host_errors

    - name: Reboot to apply CIS changes that require a restart
      ansible.windows.win_reboot:
        reboot_timeout: 900

    - name: "CI FIX: Re-enable remote UAC tokens for Packer"
      win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: LocalAccountTokenFilterPolicy
        data: 1
        type: dword
        state: present

    - name: "CI FIX: Delete Group Policy WinRM registry keys that override Basic auth"
      # The ansible-lockdown role writes AllowBasic=0 to the GP registry path.
      # After a restart, Group Policy enforces this and overrides the WSMan:
      # service config set below. Deleting these keys means Group Policy has
      # nothing to enforce, so the WSMan: setting takes effect instead.
      win_regedit:
        path: "{{ item }}"
        name: AllowBasic
        state: absent
      loop:
        - HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client
        - HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service

    - name: "CI FIX: Delete Group Policy unencrypted traffic keys"
      win_regedit:
        path: "{{ item }}"
        name: AllowUnencryptedTraffic
        state: absent
      loop:
        - HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client
        - HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service

    - name: "CI FIX: Re-enable WinRM Basic Auth via service config for Packer"
      win_shell: Set-Item -Path WSMan:\localhost\Service\Auth\Basic -Value $true

    - name: "CI FIX: Temporarily allow NTLM traffic for Packer WinRM session"
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0
        name: RestrictReceivingNTLMTraffic
        data: 0
        type: dword
        state: present
      # NOTE: Restored to CIS-required value of 2 by finalize.ps1 / apply-winrm-cis-controls.ps1